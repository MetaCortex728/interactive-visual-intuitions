<style>
#sequence-studio .story-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
#sequence-studio .story-header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin:12px 0}
#sequence-studio .story-pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
#sequence-studio .story-pane{min-width:0}
#sequence-studio .story-scene{height:300px;width:100%;position:relative}
#sequence-studio .story-scene canvas{display:block;width:100%;height:100%;touch-action:none}
#sequence-studio .story-svg{display:block;width:100%;overflow:visible}
#sequence-studio .story-svg text{fill:var(--foreground);font-size:12px}
#sequence-studio .story-sequence{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:14px 0}
#sequence-studio .story-time{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0}
#sequence-studio .story-scrub{flex:1;min-width:min(180px,100%)}
#sequence-studio .story-essence{min-height:24px;margin:12px 0}
#sequence-studio .story-selection{margin:8px 0;min-height:20px}
#sequence-studio .story-picks{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
#sequence-studio .story-svg [data-token]{cursor:inherit}
#math-journey [hidden]{display:none!important}
@media(max-width:660px){#sequence-studio .story-pair{grid-template-columns:1fr;gap:14px}#sequence-studio .story-scene{height:260px}}
</style>
<section id="sequence-studio" aria-label="Linked visual sequences">
  <nav id="story-tabs" class="story-tabs" aria-label="Visual stories"></nav>
  <div class="story-header"><h3 id="story-title"></h3><span id="story-step" class="text-small tabular-nums"></span></div>
  <div id="story-options" class="viz-controls"></div>
  <div class="story-pair">
    <section class="story-pane"><div id="story-left-title" class="text-small"></div><div id="story-left"></div></section>
    <section class="story-pane"><div id="story-right-title" class="text-small"></div><div id="story-right"></div></section>
  </div>
  <div id="story-sequence" class="story-sequence" aria-label="Chronological sequence"></div>
  <div class="story-time">
    <button type="button" class="btn" id="story-restart" aria-label="Restart sequence" data-tooltip="Restart sequence"><i data-lucide="rotate-ccw" aria-hidden="true"></i></button>
    <button type="button" class="btn" id="story-back" aria-label="Previous transition" data-tooltip="Previous transition"><i data-lucide="skip-back" aria-hidden="true"></i></button>
    <button type="button" class="btn btn-primary" id="story-play" aria-label="Play sequence" data-tooltip="Play or pause"><i data-lucide="play" aria-hidden="true"></i></button>
    <button type="button" class="btn" id="story-forward" aria-label="Next transition" data-tooltip="Next transition"><i data-lucide="skip-forward" aria-hidden="true"></i></button>
    <label class="form-label story-scrub">Sequence position <input class="form-range" id="story-progress" type="range" min="0" max="8" step="0.01" value="0"></label>
  </div>
  <div id="story-essence" class="story-essence" aria-live="polite"></div>
  <div id="story-selection" class="story-selection text-small"></div>
  <div id="story-picks" class="story-picks" aria-label="Track identity"></div>
  <div id="story-error" class="text-small" role="status" hidden></div>
  <div class="viz-row"><button type="button" class="btn btn-ghost" id="story-lab">Explore the underlying model</button><button type="button" class="btn btn-ghost" id="story-next">Next connection</button></div>
</section>
