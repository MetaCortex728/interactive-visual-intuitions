<style>
#math-journey { color:var(--foreground); }
#math-journey .journey-nav {display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:6px;margin-block:16px;}
#math-journey .chapter-head {display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between;padding-right:92px;}
#math-journey .panes {display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:16px;}
#math-journey .diagram {display:block;width:100%;overflow:visible;}
#math-journey .diagram text {fill:var(--foreground);font-size:12px;}
#math-journey .diagram .structure {stroke:var(--border);fill:none;stroke-width:1.5;}
#math-journey .diagram .active-path {stroke:var(--viz-series-1);fill:none;stroke-width:3;}
#math-journey .tile-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:370px;margin:20px auto;}
#math-journey .tile-grid .tile-label {display:block;padding-block:14px;}
#math-journey .token {display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;color:var(--foreground);margin:3px;background:color-mix(in srgb,var(--token-color) 22%,transparent);}
#math-journey .arrangements {display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-block:24px;}
#math-journey .orbit-group {padding-block:8px;border-bottom:1px solid var(--border);}
#math-journey .readout {display:flex;flex-wrap:wrap;gap:10px 24px;margin-block:12px;}
#math-journey .legend {display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;}
#math-journey .key {display:inline-block;width:18px;height:4px;vertical-align:middle;margin-right:6px;background:var(--key-color);}
#math-journey .connection-list {display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;}
#math-journey .route-link {display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-block:10px;}
#math-journey .source-map {display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:12px;}
#math-journey .chapter-foot {display:flex;justify-content:space-between;gap:12px;margin-top:20px;}
#math-journey .form-label {min-width:0;}
#math-journey output {font-variant-numeric:tabular-nums;}
@media(max-width:440px){#math-journey .chapter-head {padding-right:0;}#math-journey .journey-nav {grid-template-columns:repeat(2,minmax(0,1fr));}}
</style>
<div id="math-journey">
  <div class="chapter-head"><h2>Mathematics of Change</h2><span id="journey-count" class="text-small"></span></div>
  <div class="viz-row" aria-label="Presentation"><button class="btn" id="journey-sequences" type="button" aria-pressed="true">Visual sequences</button><button class="btn" id="journey-fields" type="button" aria-pressed="false">Explore all fields</button></div>
  <div id="journey-sequence-host"><!-- SEQUENCE MARKUP --></div>
  <div id="journey-lab-surface" hidden>
  <nav class="journey-nav" aria-label="Progressive mathematical journey" id="journey-nav"></nav>
  <section aria-labelledby="journey-title">
    <span id="journey-field" class="text-small text-muted"></span>
    <h3 id="journey-title"></h3>
    <div id="journey-controls" class="viz-controls"></div>
    <div id="journey-visual"></div>
    <div id="journey-legend" class="legend"></div>
    <div id="journey-readout" class="readout tabular-nums" aria-live="polite"></div>
    <div id="journey-detail" class="text-small"></div>
    <div class="chapter-foot"><button class="btn" type="button" id="journey-prev">Previous</button><button class="btn btn-primary" type="button" id="journey-next">Next</button></div>
  </section>
  </div>
</div>

(function(){

  function normalize(raw){const x={...defaults};if(!raw||typeof raw!=='object')return x;for(const key of ['merge','all','showEuler','showCayley','precondition','punctured'])if(typeof raw[key]==='boolean')x[key]=raw[key];const limits={chapter:[0,12,1],n:[3,12,1],k:[0,11,1],tick:[0,36,1],start:[0,5,1],neck:[0,15,1],value:[-2,180,0],h:[0.05,0.5,0],steps:[0,60,1],alpha:[0,0.5,0],time:[0,40,1],mode:[0,4,1],modeTime:[0,20,1],modeAlpha:[0,0.5,0],kappa:[1,12,1],gain:[0.2,2.4,0],iterations:[0,18,1],winding:[-2,2,1],radius:[0.4,1.8,0],center:[0,2,0],aspect:[0.3,1.5,0],progress:[0,1,0]};for(const [key,[lo,hi,int]]of Object.entries(limits))if(Number.isFinite(raw[key]))x[key]=Math.max(lo,Math.min(hi,int?Math.round(raw[key]):raw[key]));x.k=Math.min(x.k,x.n-1);if(['shear','scale','projection','rotation'].includes(raw.kind))x.kind=raw.kind;x.value=Math.max(x.kind==='rotation'?-180:-2,Math.min(x.kind==='rotation'?180:2,x.value));if(Array.isArray(raw.word)&&raw.word.every(v=>v==='r'||v==='s'))x.word=raw.word.slice(0,36);if(Array.isArray(raw.board)&&raw.board.length===9&&[...raw.board].sort().join('')==='012345678')x.board=raw.board.slice();return x;}

  }
  const NS='http://www.w3.org/2000/svg';

  const line=(s,x1,y1,x2,y2,stroke='var(--border)',width=1.5,extra={})=>s.append(svgEl('line',{x1,y1,x2,y2,stroke,'stroke-width':width,...extra}));

    if(st.chapter===1){const host=pane('Addition modulo '+st.n),{svg,W,H}=diagram(host,'Modular addition orbits'),r=Math.min(W/2-35,112),cx=W/2,cy=H/2,points=Array.from({length:st.n},(_,i)=>[cx+r*Math.sin(2*Math.PI*i/st.n),cy-r*Math.cos(2*Math.PI*i/st.n)]),orbits=M.clock(st.n,st.k);orbits.forEach((orbit,j)=>orbit.forEach(i=>{line(svg,...points[i],...points[(i+st.k)%st.n],C(j),1.5);dot(svg,...points[i],17,C(j),i);}));const current=M.mod(st.tick*st.k,st.n);svg.append(svgEl('circle',{cx:points[current][0],cy:points[current][1],r:22,fill:'none',stroke:'var(--foreground)','stroke-width':2}));outputs([['gcd(n,k)',M.gcd(st.n,st.k)],['Orbits',orbits.length],['Orbit length',st.n/M.gcd(st.n,st.k)],['Current position',current]],'Edges follow +'+st.k+' modulo '+st.n+'; the outlined position starts from 0.');}

    if(st.chapter===6){const A=M.matrix(st.kind,st.value),square=[[0,0],[1,0],[1,1],[0,1],[0,0]],host=pane('Unit square and basis images'),sets=[{points:square,color:'var(--border)'},{points:square.map(v=>M.mv(A,v)),color:C(0),closed:true},{points:[[0,0],M.mv(A,[1,0])],color:C(1),width:3,end:true},{points:[[0,0],M.mv(A,[0,1])],color:C(2),width:3,end:true}];geometry(host,'Linear transformation in the coordinate plane',sets,2);outputs([['Matrix','['+A.map(fmt).join(', ')+']'],['det(A)',fmt(M.det(A))],['Rank',Math.abs(M.det(A))<1e-10?1:2]],'Matrix entries are shown row by row. Determinant gives signed area, not perimeter.');legend([['Unit square','var(--border)'],['Image',C(0)],['A e1',C(1)],['A e2',C(2)]]);}
    if(st.chapter===7){const f=M.flow(st.h,st.steps),host=pane('Rotation trajectories'),sets=[{points:f.exact,color:C(0),end:true}];if(st.showEuler)sets.push({points:f.euler,color:C(1),end:true});if(st.showCayley)sets.push({points:f.cayley,color:C(2),end:true});geometry(host,'Exact rotation and numerical trajectories',sets,1.3);outputs([['Simulated time',fmt(st.h*st.steps)],['Exact radius',1],['Euler radius',fmt(Math.hypot(...f.euler.at(-1)))],['Midpoint radius',fmt(Math.hypot(...f.cayley.at(-1)))]],'The plot scale fits every visible trajectory; midpoint preserves radius, not exact phase.');legend([['Exact',C(0)],['Euler',C(1)],['Midpoint',C(2)]]);}
    if(st.chapter===8){const p=M.randomWalk(6,st.alpha,st.time),host=pane('Probability mass on the cycle'),{svg,W,H}=diagram(host,'Exact distribution after random-walk steps',330),rad=Math.min(W/2-55,104),pts=p.map((_,i)=>[W/2+rad*Math.sin(i*Math.PI/3),H/2-rad*Math.cos(i*Math.PI/3)]);pts.forEach((a,i)=>line(svg,...a,...pts[(i+1)%6]));p.forEach((v,i)=>{dot(svg,...pts[i],Math.sqrt(64+900*v),C(i%2),i);text(svg,pts[i][0],pts[i][1]+45,fmt(v));});outputs([['Mass total',fmt(p.reduce((a,b)=>a+b,0))],['Entropy (bits)',fmt(M.entropy(p))],['TV to uniform',fmt(M.tv(p))]],'Circle area minus its fixed baseline is proportional to probability; exact masses are labeled.');legend([['Even vertices',C(0)],['Odd vertices',C(1)]]);}
    if(st.chapter===9){const m=M.mode(8,st.mode,st.modeAlpha,st.modeTime),host=pane('Eight samples of one Fourier mode'),{svg,W,H}=diagram(host,'Original and filtered cosine samples',330),left=36,right=W-20,top=55,bottom=270,mid=(top+bottom)/2,xy=(i,v)=>[left+i*(right-left)/7,mid-v*(bottom-top)/2];line(svg,left,mid,right,mid);text(svg,left,25,'amplitude','start');text(svg,right,310,'vertex j (mod 8)','end');text(svg,20,top+4,'1');text(svg,20,mid+4,'0');text(svg,20,bottom+4,'-1');m.original.forEach((v,i)=>{line(svg,...xy(i,0),...xy(i,v),'var(--border)',2);dot(svg,...xy(i,v),5,'var(--foreground)');const f=xy(i,m.filtered[i]);dot(svg,...f,7,C(0));text(svg,f[0],293,i);});outputs([['Eigenvalue',fmt(m.lambda)],['Scale after t',fmt(m.lambda**st.modeTime)],['Maximum amplitude',fmt(Math.max(...m.filtered.map(Math.abs)))]],'Neutral marks: original cosine. Colored marks: repeated local averaging; the eigenvalue formula matches it.');legend([['Original','var(--border)'],['Filtered',C(0)]]);}
    if(st.chapter===10){const d=M.descent(st.kappa,st.gain,st.iterations,st.precondition),host=pane('Quadratic level sets and iteration path'),bound=Math.max(2,...d.path.flatMap(p=>p.map(Math.abs))),contours=[0.15,0.4,0.75,1].map(q=>({points:Array.from({length:100},(_,i)=>[bound*q*Math.cos(i*2*Math.PI/99),bound*q*Math.sin(i*2*Math.PI/99)/Math.sqrt(st.kappa)]),color:'var(--border)',width:1}));geometry(host,'Descent path on elliptical level sets',[...contours,{points:d.path,color:C(0),end:true}],bound);outputs([['Direction multipliers',d.factors.map(fmt).join(', ')],['Final objective',fmt(d.values.at(-1))],['Relative objective',fmt(d.values.at(-1)/d.values[0])]],st.gain>=2?'At this gain the iteration does not contract in every direction.':'The scale fits the full trajectory; the objective is evaluated from the same iterates.');}
    if(st.chapter===11){const a=M.loop(st.winding,st.radius,st.center,st.aspect),host=pane(st.punctured?'Plane minus the origin':'Full plane'),{svg,xy}=geometry(host,'Loop and winding about the origin',[{points:a.points,color:C(0)}],Math.max(2,st.center+st.radius)),i=Math.round(st.progress*(a.points.length-1));dot(svg,...xy(a.points[i]),7,C(0));if(st.punctured){svg.append(svgEl('circle',{cx:xy([0,0])[0],cy:xy([0,0])[1],r:7,stroke:'var(--destructive)',fill:'var(--background)','stroke-width':2}));}const valid=!st.punctured||!a.crossing,contract=st.punctured?(a.crossing?'Not an allowed loop':a.winding===0?'Yes':'No'):'Yes';outputs([['Winding about origin',a.crossing?'Undefined':a.winding],['Allowed in this space',valid?'Yes':'No'],['Contractible here',contract]],st.punctured?'Changing winding must cross the missing origin. Shape controls are not fixed-basepoint homotopies.':'Every loop contracts in the full plane; winding about a chosen point is no longer protected.');}
    if(st.chapter===12){const host=pane('Follow a connection'),list=el('div',{class:'connection-list'});M.connections.forEach(([a,b,label])=>{const row=el('div',{class:'route-link'});row.append(button(names[a],()=>go(a)),el('span',{class:'text-small'},label+' →'),button(names[b],()=>go(b)));list.append(row);});host.append(list);outputs([['Interactive chapters',12],['Explicit connections',M.connections.length]],'The full reading companion includes derivations, reflection prompts, complexity assumptions and further branches.');}
  }
  $('prev').addEventListener('click',()=>go(Math.max(0,state.chapter-1)));$('next').addEventListener('click',()=>go(Math.min(12,state.chapter+1)));
  let width=0;new ResizeObserver(entries=>{const w=entries[0].contentRect.width;if(Math.abs(w-width)>1){width=w;draw();}}).observe($('visual'));
  view();
  $('sequences').onclick=()=>{state.presentation='sequence';presentation();save();};$('fields').onclick=()=>{state.presentation='lab';view();save();};
  window.MathJourneyStudioSave=studio=>{state.studio=studio;save();};
  window.MathJourneyBindStudio=()=>{window.SequenceStudio.restore(state.studio);presentation();};
  window.MathJourneyTest={state:()=>JSON.parse(JSON.stringify(state)),select:go,restore:raw=>{state=normalizePresentation({...raw,presentation:raw.presentation||'lab'});view();},model:M};
})();
