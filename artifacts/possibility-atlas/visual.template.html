<div id="possibility-atlas">
  <style>
    #possibility-atlas {color:var(--foreground);font-family:inherit}
    #possibility-atlas .pa-nav,#possibility-atlas .pa-tools {display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
    #possibility-atlas .pa-panels {display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:24px}
    #possibility-atlas .pa-drawing {width:100%;min-width:0}
    #possibility-atlas .pa-drawing svg {display:block;width:100%;overflow:visible}
    #possibility-atlas svg text {fill:var(--foreground);font-size:12px;font-family:inherit}
    #possibility-atlas .pa-equation {font-family:ui-monospace,monospace;overflow-wrap:anywhere;margin:10px 0}
    #possibility-atlas .pa-caption {margin:8px 0;overflow-wrap:anywhere}
    #possibility-atlas .pa-selection {display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
    #possibility-atlas .pa-proof {display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;margin:12px 0}
    #possibility-atlas .pa-dot {width:12px;height:12px;display:inline-block;border-radius:50%;margin-right:6px;background:var(--viz-series-1)}
    #possibility-atlas .pa-metrics {display:flex;gap:20px;flex-wrap:wrap;margin:12px 0}
    #possibility-atlas .pa-metrics span {overflow-wrap:anywhere}
    #possibility-atlas .pa-range {min-width:0;flex:1 1 180px}
    #possibility-atlas [hidden] {display:none!important}
    #possibility-atlas summary {margin:12px 0}
    #possibility-atlas .pa-view {min-width:0}
    #possibility-atlas svg .pa-line {fill:none;stroke:var(--border);stroke-width:1.5}
    #possibility-atlas svg .pa-active {fill:none;stroke:var(--viz-series-1);stroke-width:4}
    #possibility-atlas .pa-foot {margin:18px 0 0}
    #possibility-atlas .pa-layer {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0 18px}
    #possibility-atlas .pa-layer .pa-token {display:flex;align-items:center;justify-content:center;gap:5px}
    #possibility-atlas .pa-token svg {width:22px;height:22px;flex-shrink:0}
    @media(prefers-reduced-motion:no-preference){#possibility-atlas svg .pa-bead {transition:cx .25s,cy .25s}}
  </style>
  <h2>The shape of possibility</h2>
  <div class="pa-nav" id="pa-nav" aria-label="Mathematical structures"></div>
  <div class="pa-tools" id="pa-controls"></div>
  <div class="pa-selection" id="pa-actions"></div>
  <div class="pa-metrics" id="pa-metrics" aria-live="polite"></div>
  <div class="pa-panels">
    <section class="pa-view"><h3 id="pa-title-a"></h3><div id="pa-a" class="pa-drawing"></div></section>
    <section class="pa-view"><h3 id="pa-title-b"></h3><div id="pa-b" class="pa-drawing"></div></section>
  </div>
  <div id="pa-caption" class="pa-caption" aria-live="polite"></div>
  <hr>
  <div class="pa-metrics"><span id="pa-count"></span></div>
  <div class="pa-proof">
    <button type="button" class="btn" id="pa-proof-back" aria-label="Previous derivation step">←</button>
    <div><div id="pa-proof-label" class="text-small"></div><div id="pa-formula" class="pa-equation"></div><div id="pa-reason"></div></div>
    <button type="button" class="btn" id="pa-proof-next" aria-label="Next derivation step">→</button>
  </div>
  <div class="pa-foot text-small"><a href="https://cube20.org/" target="_blank" rel="noreferrer">Cube20</a> · All diagrams calculated locally</div>
</div>
<script>
/* MODEL */
/* PRESETS */
(()=>{
  const root=document.getElementById('possibility-atlas'),$=id=>root.querySelector('#pa-'+id),M=window.Possibility;
  const tabs=['Permutations','Combinations','Repeated colours','Stars & bars','Words vs states','Legal cube states','1D → 2D → 3D'];
  const defaults={tab:6,n:5,k:3,rank:47,progress:65,source:'generic',preset:2,lens:'cycles',subset:[0,2,4],multi:[2,2,1],multiRank:0,stars:[2,1,1],word:[0,1,0],depth:3,twist:0,flip:0,cp:0,ep:0,proof:0,dim:1,lineNine:false,history:[0,1,0],selected:-1,exampleSeed:37,compareNine:false};
  let state=structuredClone(defaults),steps=[],lastKey='';
  const color=i=>'var(--viz-series-'+(i%6+1)+')',fmt=v=>v.toLocaleString('en-US');
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const text=(x,y,t,extra='')=>`<text x="${x}" y="${y}" ${extra}>${esc(t)}</text>`;
  const line=(x,y,X,Y,extra='')=>`<line x1="${x}" y1="${y}" x2="${X}" y2="${Y}" class="pa-line" ${extra}/>`;
  function svg(id,h,content,label){const w=Math.max(260,$(id).clientWidth);$(id).innerHTML=`<svg viewBox="0 0 ${w} ${h}" height="${h}" role="img" aria-label="${esc(label)}">${content(w)}</svg>`;}
  function button(label,fn,pressed=false){const b=document.createElement('button');b.type='button';b.className='btn';b.textContent=label;b.setAttribute('aria-pressed',String(pressed));b.onclick=fn;return b;}
  function action(label,fn,pressed=false){$('actions').append(button(label,()=>{fn();render();save();},pressed));}
  function range(label,min,max,val,fn){const l=document.createElement('label');l.className='form-label pa-range';l.append(document.createTextNode(label+': '+val));const i=document.createElement('input');i.type='range';i.className='form-range';i.min=min;i.max=max;i.value=val;i.setAttribute('aria-label',label);i.oninput=()=>{fn(Number(i.value));render(false);save();l.firstChild.textContent=label+': '+i.value;};i.onchange=()=>render();l.append(i);$('controls').append(l);}
  function metric(...v){$('metrics').replaceChildren(...v.map(t=>{const e=document.createElement('span');e.textContent=t;return e;}));}
  function titles(a,b){$('title-a').textContent=a;$('title-b').textContent=b;}
  function costs(count){$('count').textContent='Count: '+count;}
  function proof(data){steps=data;state.proof=Math.min(state.proof,steps.length-1);const v=steps[state.proof];$('proof-label').textContent='Derivation '+(state.proof+1)+' / '+steps.length;$('formula').textContent=v[0];$('reason').textContent=v[1];$('proof-back').disabled=state.proof===0;$('proof-next').disabled=state.proof===steps.length-1;}
  function circles(p,names){svg('b',310,w=>{const cx=w/2,cy=150,r=Math.min(w/2-42,110),pts=p.map((_,i)=>[cx+r*Math.cos(i*2*Math.PI/p.length-Math.PI/2),cy+r*Math.sin(i*2*Math.PI/p.length-Math.PI/2)]);let s='';p.forEach((j,i)=>{if(i===j)return;const a=pts[i],b=pts[j],dist=Math.hypot(b[0]-a[0],b[1]-a[1]),qx=(a[0]+b[0])/2-22*(b[1]-a[1])/dist,qy=(a[1]+b[1])/2+22*(b[0]-a[0])/dist;s+=`<path d="M${a[0]},${a[1]} Q${qx},${qy} ${b[0]},${b[1]}" fill="none" stroke="${color(i)}" stroke-width="2" opacity=".65"/>`;const t=.7,x=(1-t)**2*a[0]+2*(1-t)*t*qx+t*t*b[0],y=(1-t)**2*a[1]+2*(1-t)*t*qy+t*t*b[1],angle=Math.atan2((1-t)*(qy-a[1])+t*(b[1]-qy),(1-t)*(qx-a[0])+t*(b[0]-qx))*180/Math.PI;s+=`<path d="M-6,-4 L4,0 L-6,4 Z" fill="${color(i)}" transform="translate(${x} ${y}) rotate(${angle})"/>`;});pts.forEach(([x,y],i)=>{s+=`<circle cx="${x}" cy="${y}" r="16" fill="${color(i)}" fill-opacity=".18"/>`+text(x,y+4,names[i],'text-anchor="middle"');});return s+text(cx,300,'Arrows follow source → destination','text-anchor="middle"');},'Directed permutation cycles, including fixed points.');}
  function permutation(controls){
    state.n=Math.min(6,state.n);state.rank=Math.min(state.rank,Number(M.fact(state.n))-1);
    if(controls){range('Items n',3,6,state.n,v=>{state.n=v;state.rank=Math.min(state.rank,Number(M.fact(v))-1);state.source='generic';});range('Permutation rank',0,Number(M.fact(state.n))-1,state.rank,v=>{state.rank=v;state.source='generic';});range('Travel %',0,100,state.progress,v=>state.progress=v);}
    action('Abstract items',()=>state.source='generic',state.source==='generic');action('Cube corners',()=>state.source='corners',state.source==='corners');action('Cube edges',()=>state.source='edges',state.source==='edges');
    if(state.source!=='generic')cubePresets.forEach((p,i)=>action(p.alg,()=>state.preset=i,state.preset===i));
    action('Cycle rings',()=>state.lens='cycles',state.lens==='cycles');action('Permutation matrix',()=>state.lens='matrix',state.lens==='matrix');
    const item=state.source==='generic'?null:cubePresets[state.preset][state.source],p=item?item.p:M.unrank(state.n,state.rank),names=item?item.names:p.map((_,i)=>String.fromCharCode(65+i)),n=p.length,t=state.progress/100;
    titles('Coloured trajectories',state.lens==='cycles'?'Cycle decomposition':'Destination matrix');
    metric(n+' distinct pieces',fmt(M.fact(n))+' unconstrained permutations','Parity: '+(M.parity(p)?'odd':'even'));
    svg('a',n*33+54,w=>{const x=38,X=w-42;let s=text(x,16,'From','text-anchor="middle"')+text(X,16,'To','text-anchor="middle"');p.forEach((j,i)=>{const y=40+i*33,Y=40+j*33,cx=(x+X)/2;s+=`<path d="M${x},${y} C${cx},${y} ${cx},${Y} ${X},${Y}" fill="none" stroke="${color(i)}" stroke-width="3" opacity=".55"/>`;const bx=(1-t)**3*x+3*(1-t)**2*t*cx+3*(1-t)*t*t*cx+t**3*X,by=(1-t)**3*y+3*(1-t)**2*t*y+3*(1-t)*t*t*Y+t**3*Y;s+=`<circle class="pa-bead" cx="${bx}" cy="${by}" r="7" fill="${color(i)}"/>`+text(x-13,y+4,names[i],'text-anchor="end"')+text(X+13,y+4,names[i],'text-anchor="start"');});return s;},'One coloured trajectory per piece. From and To labels denote positions.');
    if(state.lens==='cycles')circles(p,names);else svg('b',330,w=>{const sz=Math.min((w-60)/n,25),x=(w-n*sz)/2,y=35;let s='';for(let i=0;i<n;i++){s+=text(x-8,y+i*sz+sz*.7,names[i],'text-anchor="end"')+text(x+(i+.5)*sz,y-8,names[i],'text-anchor="middle"');for(let j=0;j<n;j++)s+=`<rect x="${x+j*sz+1}" y="${y+i*sz+1}" width="${sz-2}" height="${sz-2}" fill="${p[i]===j?color(i):'var(--muted)'}" fill-opacity="${p[i]===j?1:.5}"/>`;}return s+text(w/2,y+n*sz+25,'Rows: source / columns: destination','text-anchor="middle"');},'Permutation matrix: exactly one occupied cell in each row and column.');
    $('caption').textContent=(item?'Actual '+cubePresets[state.preset].alg+' position permutation from cubejs; cubie orientation is omitted. Colours identify pieces, not face colours. ':'Rank is lexicographic; motion percentage does not change the permutation. ')+'Cycles: '+M.cycles(p).map(c=>'('+c.map(i=>names[i]).join(' ')+')').join(' ');
    costs('n!');
    proof([['n × (n − 1) × … × 1 = n!','Each piece placed uses up one destination, leaving one fewer choice for the next piece.'],['Follow a piece until it comes back','Start at any piece, see where it goes, then where the piece at that position goes, and so on until you return. That loop is a cycle.'],['Cycle lengths add up to n','Every piece is in exactly one cycle. A piece that stays put is a cycle of length 1.'],['Repeats to return = lcm(cycle lengths)','A cycle of length l is back home after every l repeats, so all pieces are home together for the first time at the least common multiple of the lengths. On a real cube, twists and flips must also come back, so position cycles alone do not give the repeat count of a cube sequence.']]);
  }
  function combination(controls){
    if(controls){range('Items n',3,8,state.n,v=>{state.n=v;state.k=Math.min(state.k,v);state.subset=M.subsets(v,state.k)[0];});range('Chosen k',0,state.n,state.k,v=>{state.k=v;state.subset=M.subsets(state.n,v)[0];});}
    const n=state.n,k=Math.min(state.k,n),sets=M.subsets(n,k),selected=state.subset.filter(x=>x<n);if(selected.length!==k)state.subset=sets[0];
    const rank=Math.max(0,sets.findIndex(a=>a.join()===state.subset.join()));action('Previous subset',()=>state.subset=sets[(rank-1+sets.length)%sets.length]);action('Next subset',()=>state.subset=sets[(rank+1)%sets.length]);
    titles('Selection becomes a lattice path','Order disappears');metric('Subset '+(rank+1)+' / '+sets.length,'Ordered selections: '+fmt(M.falling(n,k)),'Orders per subset: '+fmt(M.fact(k)));
    svg('a',310,w=>{const rows=k+1,dx=(w-50)/(n+1),dy=210/Math.max(k,1),x=i=>25+i*dx,y=j=>260-j*dy;let s='';for(let i=0;i<=n;i++)for(let j=0;j<=Math.min(i,k);j++){if(i<n){s+=line(x(i),y(j),x(i+1),y(j));if(j<k)s+=line(x(i),y(j),x(i+1),y(j+1));}s+=`<circle cx="${x(i)}" cy="${y(j)}" r="3" fill="var(--border)"/>`;if(i===n)s+=text(x(i)+8,y(j)+4,String(M.choose(i,j)));}let j=0;for(let i=0;i<n;i++){const J=j+(state.subset.includes(i)?1:0);s+=`<path class="pa-active" d="M${x(i)},${y(j)} L${x(i+1)},${y(J)}"/>`+text(x(i),288,String.fromCharCode(65+i),'text-anchor="middle"');j=J;}return s+text(20,18,'Rise = choose; level = skip');},'Subset encoded as a choose-or-skip path ending at n,k. Endpoint labels are Pascal counts.');
    const orders=M.permutations(state.subset).slice(0,6);svg('b',310,w=>{let s=text(10,18,'One subset: {'+state.subset.map(i=>String.fromCharCode(65+i)).join(', ')+'}');orders.forEach((a,r)=>{a.forEach((i,c)=>{const x=18+c*Math.min(35,(w-35)/Math.max(k,1)),y=50+r*35;s+=`<rect x="${x}" y="${y}" width="27" height="25" rx="3" fill="${color(i)}" fill-opacity=".3"/>`+text(x+13,y+17,String.fromCharCode(65+i),'text-anchor="middle"');});});return s+text(10,290,'Showing '+orders.length+' of '+fmt(M.fact(k))+' equivalent orders');},'Different ordered selections collapse to the same unordered subset.');
    $('caption').textContent='The endpoint counts paths, not the drawn vertices. Each subset corresponds to exactly one rise/skip path; k! orders collapse to it.';
    costs('C(n,k) = n! / [k!(n−k)!]');
    proof([['P(n,k) = n(n−1)…(n−k+1)','For now, keep the chosen items in the order they were picked. This gives an ordered list of k different items.'],['C(n,k) = P(n,k) / k!','Every k-element subset has exactly k! orders. Dividing removes only order, not which pieces were selected.'],['C(n,k) = C(n−1,k) + C(n−1,k−1)','Split paths by whether the last item is skipped or chosen. This is Pascal’s recurrence.'],['C(n,0) + C(n,1) + … + C(n,n) = 2ⁿ','Each item is either in or out, independently of the others: 2 × 2 × … × 2 = 2ⁿ choices in total.']]);
  }
  function repeated(controls){
    if(controls)state.multi.forEach((c,i)=>range('Count '+String.fromCharCode(65+i),0,3,c,v=>{state.multi[i]=v;state.multiRank=0;}));
    const counts=state.multi,n=counts.reduce((a,b)=>a+b,0),all=M.multiset(counts),idx=state.multiRank%all.length,p=all[idx];
    action('Previous arrangement',()=>state.multiRank=(idx-1+all.length)%all.length);action('Next arrangement',()=>state.multiRank=(idx+1)%all.length);
    titles('Colour words','Identity is forgotten');metric(n+' objects',fmt(M.fact(n))+' labelled arrangements',all.length+' different colour words');
    svg('a',260,w=>{const cols=Math.max(1,Math.floor((w-24)/34));let s='';p.forEach((v,i)=>{let x=12+(i%cols)*34,y=45+Math.floor(i/cols)*44;s+=`<rect x="${x}" y="${y}" width="28" height="32" rx="3" fill="${color(v)}" fill-opacity=".35"/>`+text(x+14,y+21,String.fromCharCode(65+v),'text-anchor="middle"');});return s+text(12,18,'Arrangement '+(idx+1)+' / '+all.length)+text(12,230,'Colour kept; which object is which forgotten');},'An arrangement of repeated coloured tokens.');
    svg('b',260,w=>{let s='';counts.forEach((c,i)=>{const y=45+i*66;s+=text(10,y-14,String.fromCharCode(65+i)+' group: '+c+'! = '+fmt(M.fact(c))+' relabellings');for(let j=0;j<c;j++){s+=`<circle cx="${30+j*55}" cy="${y+8}" r="18" fill="${color(i)}" fill-opacity=".3"/>`+text(30+j*55,y+12,String.fromCharCode(65+i)+(j+1),'text-anchor="middle"');}});return s;},'Labels within each colour group can be swapped around without changing the colour word.');
    $('caption').textContent='Identical-looking colours reduce the word count. Rubik’s Cube pieces are not interchangeable coloured stickers: their positions, orientations and legal moves are tied together.';
    costs('N = n! / (m₁! × m₂! × … × m_q!)');
    proof([['Label all objects: n! arrangements','For now, tell A1 and A2 apart even though they have the same visible colour.'],['Each colour word has m₁! × m₂! × … × m_q! labelled versions','Within colour i, all mᵢ! ways to swap the labels around look the same. The label swaps for different colours combine, so their counts multiply.'],['N = n! / (m₁! × m₂! × … × m_q!)','Every colour word was counted the same number of times, so dividing gives the number of different colour words.'],['Check: A, A, B gives 3! / 2! = 3','The three colour words are AAB, ABA and BAA.']]);
  }
  function stars(controls){
    if(controls)state.stars.forEach((v,i)=>range('Box '+String.fromCharCode(65+i),0,5,v,x=>state.stars[i]=x));
    const q=state.stars.length,k=state.stars.reduce((a,b)=>a+b,0),n=k+q-1;
    titles('Stars and separator bars','The same object as box counts');metric(k+' identical stars',q+' labelled boxes',fmt(M.choose(n,q-1))+' distributions');
    const tokens=[];state.stars.forEach((v,i)=>{for(let j=0;j<v;j++)tokens.push({v:'*',i});if(i<q-1)tokens.push({v:'|',i:-1});});
    svg('a',280,w=>{const cols=Math.max(1,Math.floor((w-24)/27));return tokens.map((a,i)=>{const x=20+(i%cols)*27,y=55+Math.floor(i/cols)*45;return a.i<0?`<rect x="${x-2}" y="${y-20}" width="4" height="30" fill="var(--foreground)"/>`:`<circle cx="${x}" cy="${y-5}" r="9" fill="${color(a.i)}"/>`;}).join('')+text(12,18,k+' stars + '+(q-1)+' bars')+text(12,250,'Bar positions determine every box count');},'Stars and bars encoding, wrapped into rows in reading order.');
    svg('b',280,w=>{let s='';state.stars.forEach((v,i)=>{const y=35+i*72;s+=text(12,y+18,String.fromCharCode(65+i)+': '+v);for(let j=0;j<v;j++)s+=`<circle cx="${95+j*28}" cy="${y+14}" r="9" fill="${color(i)}"/>`;});return s;},'Identical stars shared among three labelled boxes.');
    $('caption').textContent='A list of box counts, not an ordered word. A box may be empty; two bars side by side mean an empty box.';
    costs('C(k+q−1,q−1)');
    proof([['x₁ + … + x_q = k, each xᵢ ≥ 0','A box can hold several stars, and order inside a box has no meaning. The boxes themselves can be told apart.'],['k stars + (q−1) bars = k+q−1 positions','The bars separate stars into q groups, including possibly empty groups.'],['Choose the bar positions: C(k+q−1,q−1)','This is a one-to-one match: every placement of the bars gives exactly one way to fill the boxes, and every way to fill the boxes gives exactly one placement.'],['Check: 2 stars, 3 boxes gives C(4,2) = 6','The six ways are 2+0+0, 0+2+0, 0+0+2, 1+1+0, 1+0+1 and 0+1+1.']]);
  }
  function wordView(controls){
    if(controls)range('Word length d',0,7,state.depth,v=>{state.depth=v;state.word=Array.from({length:v},(_,i)=>state.word[i]??0);});
    if(state.word.length!==state.depth)state.word=Array.from({length:state.depth},(_,i)=>state.word[i]??0);
    state.word.forEach((g,i)=>action((i+1)+': '+(g?'b':'a'),()=>state.word[i]=1-g));
    action('aa = identity',()=>{state.depth=2;state.word=[0,0];});action('aba',()=>{state.depth=3;state.word=[0,1,0];});action('bab',()=>{state.depth=3;state.word=[1,0,1];});
    const graph=M.threeTokenGraph(),trace=M.trace(state.word),all=M.words(2,state.depth),groups=new Map();all.forEach(word=>{const key=M.trace(word).at(-1).join('');groups.set(key,(groups.get(key)||0)+1);});const endpoint=trace.at(-1).join('');
    titles('A word is a path','Many paths, six states');metric(fmt(2n**BigInt(state.depth))+' words of this length',groups.size+' endpoints at this exact length',groups.get(endpoint)+' words reach selected endpoint');
    svg('a',310,w=>{const shown=Math.min(4,state.depth),x=d=>20+d*(w-45)/Math.max(1,shown),nodes=d=>2**d;let s='';for(let d=0;d<=shown;d++)for(let j=0;j<nodes(d);j++){const y=30+(j+.5)*230/nodes(d);if(d<shown)for(let g=0;g<2;g++){const Y=30+(j*2+g+.5)*230/nodes(d+1);s+=line(x(d),y,x(d+1),Y);};s+=`<circle cx="${x(d)}" cy="${y}" r="3" fill="var(--border)"/>`;}let idx=0;for(let d=0;d<shown;d++){const next=idx*2+state.word[d],y=30+(idx+.5)*230/nodes(d),Y=30+(next+.5)*230/nodes(d+1);s+=`<path d="M${x(d)},${y} L${x(d+1)},${Y}" fill="none" stroke="${color(state.word[d])}" stroke-width="4"/>`;idx=next;}return s+text(10,18,'a: swap slots 1,2 / b: swap slots 2,3')+text(10,290,'Tree displays '+shown+' of '+state.depth+' levels');},'Binary tree of move words; selected prefix highlighted.');

  const distanceCache=new Map();

      if(compare){let p=[2,2,2,1,1,1,0,0,0];const path=[],dist=table(G);while(dist.get(p.join(''))>0){const e=M.shortestNext(G,p,dist);path.push(e);p=M.swapEdge(p,G.edges[e]);}state.history=path.reverse();}

    },'Target colour arrangement with its allowed swaps. Three-dimensional layers are shown as slices, not a Rubik cube.');
