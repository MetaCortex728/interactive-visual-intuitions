<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title><!--shell:title--></title>
<style>
/* Design tokens used by the lab fragments. Light first, dark under prefers-color-scheme. */
:root {
  color-scheme: light dark;
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --radius: 6px;
  --background: #fbfbf9;
  --foreground: #1c2024;
  --muted: #eceef0;
  --muted-foreground: #565e66;
  --border: #b9c0c6;
  --accent: #1d5f95;
  --accent-foreground: #ffffff;
  --accent-soft: #dce9f5;
  --destructive: #b0281a;
  --focus: #1d5f95;
  --viz-series-1: #2160b8;
  --viz-series-2: #b8510f;
  --viz-series-3: #13805a;
  --viz-series-4: #8e3fae;
  --viz-series-5: #8a6a00;
  --viz-series-6: #c0304f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --background: #15181b;
    --foreground: #e6e9eb;
    --muted: #2a2f34;
    --muted-foreground: #a7afb6;
    --border: #50585f;
    --accent: #79b4ea;
    --accent-foreground: #0e1a26;
    --accent-soft: #1f3447;
    --destructive: #ff8a7a;
    --focus: #79b4ea;
    --viz-series-1: #6aa6f2;
    --viz-series-2: #f39a5b;
    --viz-series-3: #4ccb94;
    --viz-series-4: #cf93ee;
    --viz-series-5: #e3c04f;
    --viz-series-6: #f27d98;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--background); color: var(--foreground); }
body { margin: 0 auto; max-width: 1120px; padding: 20px 20px 48px; font: 15px/1.55 var(--font-sans); background: var(--background); color: var(--foreground); }
h1, h2, h3 { line-height: 1.3; font-weight: 600; }
h2 { font-size: 1.45rem; margin: 0.4em 0; }
h3 { font-size: 1.1rem; }
a { color: var(--accent); }
code, kbd, pre { font-family: var(--font-mono); font-size: 0.92em; }
summary { cursor: pointer; font-weight: 600; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; padding: 6px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--background); color: var(--foreground); font: inherit; font-size: 0.93rem; line-height: 1.25; cursor: pointer; text-align: center; }
.btn:not(:disabled):hover { background: var(--muted); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn[aria-pressed="true"], .btn[aria-selected="true"], .btn.is-selected { background: var(--accent-soft); border-color: var(--accent); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-foreground); }
.btn-primary:not(:disabled):hover { background: var(--accent); filter: brightness(1.08); }
.btn-primary .text-muted { color: inherit; opacity: 0.85; }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:not(:disabled):hover { background: var(--muted); }
.btn svg { width: 16px; height: 16px; flex: none; }
i[data-icon] { display: inline-flex; font-style: normal; }
.viz-controls, .viz-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-block: 8px; }
.form-label { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 0.93rem; }
.form-select, .form-input { min-height: 34px; padding: 4px 8px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--background); color: var(--foreground); font: inherit; font-size: 0.93rem; }
.form-range { display: block; width: 100%; margin-block: 6px; accent-color: var(--accent); }
.text-small { font-size: 0.87rem; }
.text-muted { color: var(--muted-foreground); }
.text-destructive { color: var(--destructive); }
.tabular-nums { font-variant-numeric: tabular-nums; }
.cursor-interaction { cursor: pointer; }
@media (max-width: 480px) { body { padding: 12px 12px 40px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
</style>
<script>
/* Saved state for the labs, kept in this browser only. Every call tolerates missing or blocked storage. */
(function () {
  function storage() { try { return window.localStorage; } catch (e) { return null; } }
  window.localState = {
    read: function (key) {
      try { var s = storage(), raw = s && s.getItem(key); return raw == null ? null : JSON.parse(raw); } catch (e) { return null; }
    },
    write: function (key, value) {
      try { var s = storage(); if (s) s.setItem(key, JSON.stringify(value)); } catch (e) { /* storage full or unavailable */ }
    },
    /* Calls fn when another tab or window saves a new value for key. */
    watch: function (key, fn) {
      window.addEventListener('storage', function (e) {
        if (e.key !== key || e.newValue == null) return;
        var value;
        try { value = JSON.parse(e.newValue); } catch (err) { return; }
        fn(value);
      });
    }
  };
})();
/* Small inline icon set for elements marked <i data-icon="name">. */
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var shapes = {
    'play': '<path d="M8 5.5v13l10-6.5z" fill="currentColor" stroke="none"/>',
    'pause': '<rect x="6.5" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="13.5" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/>',
    'skip-back': '<path d="M6 5v14"/><path d="M18 5.5 9 12l9 6.5z" fill="currentColor"/>',
    'skip-forward': '<path d="M18 5v14"/><path d="M6 5.5 15 12l-9 6.5z" fill="currentColor"/>',
    'rotate-ccw': '<path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3L4.5 9"/><path d="M4.5 4.5V9H9"/>',
    'flag': '<path d="M6 21V4"/><path d="M6 4.5h11l-2.5 4 2.5 4H6"/>'
  };
  function render(root) {
    (root || document).querySelectorAll('i[data-icon]').forEach(function (i) {
      var body = shapes[i.getAttribute('data-icon')];
      if (!body || i.getAttribute('data-icon-drawn') === i.getAttribute('data-icon')) return;
      var svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('width', '16');
      svg.setAttribute('height', '16');
      svg.setAttribute('fill', 'none');
      svg.setAttribute('stroke', 'currentColor');
      svg.setAttribute('stroke-width', '2');
      svg.setAttribute('stroke-linecap', 'round');
      svg.setAttribute('stroke-linejoin', 'round');
      svg.setAttribute('aria-hidden', 'true');
      svg.innerHTML = body;
      i.replaceChildren(svg);
      i.setAttribute('data-icon-drawn', i.getAttribute('data-icon'));
    });
  }
  window.vizIcons = { render: render };
  document.addEventListener('DOMContentLoaded', function () { render(document); });
})();
/* Shows data-tooltip text as a native tooltip (title attribute, or <title> inside SVG). */
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  function tip(el) {
    var text = el.getAttribute('data-tooltip');
    if (!text) return;
    if (el instanceof SVGElement) {
      var t = el.querySelector(':scope > title');
      if (!t) { t = document.createElementNS(NS, 'title'); el.prepend(t); }
      if (t.textContent !== text) t.textContent = text;
    } else if (el.getAttribute('title') !== text) {
      el.setAttribute('title', text);
    }
  }
  function scan(node) {
    if (node.nodeType !== 1) return;
    if (node.hasAttribute('data-tooltip')) tip(node);
    node.querySelectorAll('[data-tooltip]').forEach(tip);
  }
  new MutationObserver(function (records) {
    records.forEach(function (r) {
      if (r.type === 'attributes') tip(r.target); else r.addedNodes.forEach(scan);
    });
  }).observe(document.documentElement, { subtree: true, childList: true, attributes: true, attributeFilter: ['data-tooltip'] });
})();
</script>
<!--shell:head-->
</head>
<body>

</body>
</html>
